name: Build Desktop · macOS · Intel (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [zk4/mac-x64-build]

permissions:
  contents: read

concurrency:
  group: zk4-build-mac-x64
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned installers
        run: pnpm run package:desktop:mac:x64:unsigned
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-x64-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned installers
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-x64-unsigned-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/*/unsigned-artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
